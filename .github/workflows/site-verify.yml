name: Website verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install, typecheck and build
        run: |
          npm ci
          npm run check
          npm run build
          python3 scripts/verify-site.py
      - name: Install isolated browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0 agent-browser@0.38.1
          npx playwright install --with-deps chromium
      - name: Responsive browser and interaction checks
        run: |
          mkdir -p verification
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > verification/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/verify-browser.mjs
          export AGENT_BROWSER_EXECUTABLE_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          npx agent-browser --session website-review open http://127.0.0.1:4173/game
          npx agent-browser --session website-review wait --load networkidle
          npx agent-browser --session website-review snapshot -i > verification/game-interactive.txt
          npx agent-browser --session website-review screenshot verification/game-agent.png
          npx agent-browser --session website-review close
      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-verification
          path: verification/
          if-no-files-found: warn
          retention-days: 7
