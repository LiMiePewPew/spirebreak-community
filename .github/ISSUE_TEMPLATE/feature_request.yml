name: Feature request
description: Suggest an improvement or a new direction for Spirebreak.
title: "[Feature] "
labels: ["type:feature", "status:exploring"]
body:
  - type: markdown
    attributes:
      value: Votes are useful signals, but they do not automatically determine development priority.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      placeholder: Describe the idea in a few sentences.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem or opportunity does it address?
      placeholder: What would this make clearer, deeper or more fun?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why would it improve Spirebreak?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional examples, screenshots or references.
