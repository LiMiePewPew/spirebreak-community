name: Player idea
description: Tell us what would make a future Spirebreak run better.
title: "[Idea] "
labels: ["type:feature", "status:exploring"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping shape Spirebreak. A concrete example from a run is especially useful.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to change or add?
      placeholder: Describe the idea in a few sentences. It can be a weapon, enemy, build option or quality-of-life improvement.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      placeholder: What felt missing, confusing or less fun in your run?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: How would it change a run?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional examples, screenshots or references.
